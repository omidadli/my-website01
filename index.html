  <!-- Self-hosted Vazirmatn (variable, wght 100–900) — served from the same
       Cloudflare edge as the site: no third-party DNS/TLS/redirect chain before
       first text paint. font-display: swap keeps text visible while it loads. -->
  <link rel="preload" href="/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('/fonts/Vazirmatn-Variable.woff2') format('woff2-variations'),
           url('/fonts/Vazirmatn-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <!-- Anti-FOUC: apply the saved theme (default dark) before first paint -->
  <style>
    html { background: #0b0b12; }
    html[data-theme='light'] { background: #f6f6f4; color-scheme: light; }
    html[data-theme='dark'] { color-scheme: dark; }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nd-theme') || 'dark';
        var el = document.documentElement;
        el.dataset.theme = t;
        el.classList.add(t);
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
