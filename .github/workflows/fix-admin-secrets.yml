name: One-off - sync admin login to Cloudflare

on:
  workflow_dispatch: {}
  push:
    branches: [fix/admin-login-secrets]
    paths: [".github/workflows/fix-admin-secrets.yml"]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Checkout main code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Check inputs (names and lengths only, never values)
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_USERNAME ADMIN_PASSWORD SITE_URL; do
            n=$(printf '%s' "${!v}" | wc -c)
            echo "$v length=$n"
            [ "$n" -gt 0 ] || { echo "::error title=Missing secret::$v is empty in GitHub Secrets"; exit 1; }
          done
          printf '%s' "$ADMIN_USERNAME" | grep -q '[[:space:]]' && echo "::warning title=Whitespace::ADMIN_USERNAME contains whitespace" || true
          printf '%s' "$ADMIN_PASSWORD" | grep -q '[[:space:]]' && echo "::warning title=Whitespace::ADMIN_PASSWORD contains whitespace" || true

      - name: Write admin login into Cloudflare Pages (Production) - printf avoids a trailing newline
        run: |
          printf '%s' "$ADMIN_USERNAME" | npx --yes wrangler@4 pages secret put ADMIN_USERNAME --project-name=my-website
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 pages secret put ADMIN_PASSWORD --project-name=my-website
          echo "--- secret names now on the project (values are never shown) ---"
          npx --yes wrangler@4 pages secret list --project-name=my-website || true

      - name: Deploy so the new secrets reach the live site
        run: npx --yes wrangler@4 pages deploy dist --project-name=my-website --branch=main

      - name: Verify login on the live site (status only, password never printed)
        run: |
          sleep 20
          base="${SITE_URL%/}"
          echo "health:"; curl -s --max-time 20 "$base/api/health" | head -c 600; echo
          body=$(python3 -c 'import json,os; print(json.dumps({"username":os.environ["ADMIN_USERNAME"],"password":os.environ["ADMIN_PASSWORD"]}))')
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 20 -X POST "$base/api/auth" -H 'Content-Type: application/json' -d "$body")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          python3 -c 'import json; d=json.load(open("/tmp/login.json")); d.pop("token",None); print(d)' || true
          [ "$code" = "200" ] && echo "ADMIN LOGIN OK" || { echo "::error title=Login still failing::HTTP $code"; exit 1; }
