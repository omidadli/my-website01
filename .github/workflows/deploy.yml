name: Deploy to Cloudflare Pages

# Every push to main rebuilds the site and deploys it to Cloudflare Pages,
# so anything merged on GitHub automatically lands on the live site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # The public address of the site is not a secret. It used to come from a SITE_URL *secret* that still
      # held a dead domain, which made every smoke test / export fail. Override only through the repository
      # *variable* SITE_URL (Settings → Secrets and variables → Actions → Variables) if the domain ever changes.
      SITE_URL: ${{ vars.SITE_URL || 'https://omidadli.site' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catch type errors / regressions before they reach production (vite build does not type-check).
      - name: Type-check & test
        run: |
          npm run lint
          npm run lint:functions
          npm test

      - name: Build
        run: npm run build

      # Deploys ./dist to the Cloudflare Pages project named in wrangler.toml.
      # D1 tables are created lazily at runtime by the API, so no migration step
      # is required here.
      #
      # SKIPPED (with a visible warning) until the CLOUDFLARE_API_TOKEN secret exists —
      # if you deploy via the Cloudflare Pages dashboard ("Connect to Git") instead,
      # this workflow just no-ops.
      - name: Deploy skipped → explain why
        if: ${{ env.HAS_CF_TOKEN != 'true' }}
        run: echo "::warning title=Deploy skipped::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy from GitHub Actions."

      - name: Deploy to Cloudflare Pages
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          # Create the Pages project on first run (ignored if it already exists).
          npx --yes wrangler@4 pages project create my-website --production-branch=main > create.log 2>&1
          npx --yes wrangler@4 pages deploy dist --project-name=my-website --branch=main > deploy.log 2>&1
          code=$?
          cat create.log deploy.log
          if [ $code -ne 0 ]; then
            echo "::error title=create::$(tail -n 8 create.log | tr '\n' ' ')"
            echo "::error title=deploy::$(tail -n 15 deploy.log | tr '\n' ' ')"
            exit $code
          fi

      # Verify the live site answers after the deploy (SITE_URL: see the job env above).
      - name: Smoke-test the live API
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        run: |
          url="${SITE_URL%/}/api/content"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$url" 2>/tmp/curl.err) && break
            reason=$(tr '\n' ' ' < /tmp/curl.err)
            echo "attempt $i: not ready yet ($reason), retrying in 10s…"; sleep 10
          done
          if [ -z "$body" ]; then
            # Keep curl's own words (e.g. "Could not resolve host") — they name the real cause.
            echo "::error title=Smoke test failed::$url did not answer after the deploy — ${reason:-no reason reported}. The deploy itself succeeded; if this says 'Could not resolve host', the domain/DNS is the problem, not the code."
            exit 1
          fi
          echo "$body" | head -c 300; echo
          echo "$body" | grep -q '"ok":true' || { echo "::error title=Smoke test failed::$url returned an error payload."; exit 1; }
          echo "$body" | grep -q '"data":null' && echo "::warning title=Live content is empty::The site is rendering built-in defaults. Run the 'Sync content to live site' workflow once to seed the database from content/site-content.json."
          echo "live API OK"

          # Path routing + edge <head> middleware + crawler files.
          base="${SITE_URL%/}"
          code=$(curl -s -o /tmp/services.html -w '%{http_code}' --max-time 20 "$base/services")
          [ "$code" = "200" ] || { echo "::error title=Smoke test failed::$base/services returned HTTP $code (SPA fallback / middleware broken)."; exit 1; }
          grep -q 'rel="canonical" href="[^"]*/services"' /tmp/services.html || echo "::warning title=Edge head not applied::$base/services has no per-route canonical — check functions/_middleware.ts."
          # The canonical tag must sit on the live domain itself (a stale GLOBAL_SEO.canonicalBaseUrl once pointed at a dead host).
          grep -q "rel=\"canonical\" href=\"$base/services\"" /tmp/services.html || echo "::warning title=Canonical origin::$base/services canonicalizes to a different origin than $base — check GLOBAL_SEO.canonicalBaseUrl."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/definitely-not-a-page-$RANDOM")
          [ "$code" = "404" ] || echo "::warning title=Unknown routes are not 404::got HTTP $code for an unknown path."
          curl -fsS --max-time 20 "$base/robots.txt" > /tmp/robots.txt || true
          curl -fsS --max-time 20 "$base/sitemap.xml" > /tmp/sitemap.xml || true
          grep -qi '^user-agent' /tmp/robots.txt || echo "::warning title=robots.txt::$base/robots.txt is not a robots file."
          grep -q '<urlset' /tmp/sitemap.xml || echo "::warning title=sitemap.xml::$base/sitemap.xml is not a sitemap."
          # Crawlers must never be sent to a host that is not the live domain.
          if grep -qiE 'omidadli\.com|omidadli01\.site|omidadli\.ir' /tmp/robots.txt /tmp/sitemap.xml; then
            echo "::error title=Dead domain in robots/sitemap::robots.txt or sitemap.xml still mentions a domain that is not the live site."
            exit 1
          fi
          echo "routing + crawler files OK"
