name: Sync content to live site

# When content/site-content.json changes on main, merge it into the live site's
# database via the admin API. Edit the file in a commit/PR and it goes live.
#
# Safety: the import is a per-section MERGE, not a blind overwrite —
#   * sections that only exist on the live site (theme, navigation, media
#     library, version history …) are preserved;
#   * on push, the pre-push version of the file is used as a 3-way merge base, so
#     sections edited on the live site (admin panel / Claude MCP) since the last
#     export are kept unless Git changed the same section (→ conflict → the run
#     fails with instructions; re-run manually with force=true to let Git win).
on:
  push:
    branches: [main]
    paths:
      - 'content/site-content.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'On conflict let Git win (overwrite live edits in conflicting sections)'
        type: boolean
        default: false
      dry_run:
        description: 'Only report what would change'
        type: boolean
        default: false
      base_ref:
        description: 'Git ref/commit whose content/site-content.json is the merge base (3-way merge keeps live edits). Empty = Git wins for every changed section.'
        type: string
        default: ''

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Not a secret: the public address of the site (override with the repository variable SITE_URL).
      SITE_URL: ${{ vars.SITE_URL || 'https://omidadli.site' }}
      HAS_ADMIN_CREDS: ${{ secrets.ADMIN_USERNAME != '' && secrets.ADMIN_PASSWORD != '' }}
    steps:
      - name: Checkout (full history — needed to read the pre-push version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Missing secrets → explain instead of silently passing
        if: ${{ env.HAS_ADMIN_CREDS != 'true' }}
        run: |
          echo "::warning title=Content sync skipped::Add the repository secrets ADMIN_USERNAME and ADMIN_PASSWORD (Settings → Secrets and variables → Actions) to enable Git → live-site content sync. The site address defaults to https://omidadli.site — override it with the repository variable SITE_URL only if the domain changes."

      # The version of the content file BEFORE this push = 3-way merge base.
      - name: Extract merge base
        if: ${{ env.HAS_ADMIN_CREDS == 'true' && (github.event_name == 'push' || inputs.base_ref != '') }}
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          before="${{ github.event.before }}"
          [ -n "$BASE_REF" ] && before="$BASE_REF"
          if [ -n "$before" ] && ! echo "$before" | grep -Eq '^0+$' && git cat-file -e "$before:content/site-content.json" 2>/dev/null; then
            git show "$before:content/site-content.json" > /tmp/base.json
            echo "merge base: $before"
          elif [ -n "$BASE_REF" ]; then
            echo "::error title=Bad base_ref::'$BASE_REF' has no content/site-content.json"
            exit 1
          else
            echo '{}' > /tmp/base.json
            echo "no usable merge base (first push / force-push) — Git wins for changed sections"
          fi

      - name: Merge content into the live site
        if: ${{ env.HAS_ADMIN_CREDS == 'true' }}
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          args=""
          [ -f /tmp/base.json ] && args="$args --base /tmp/base.json"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          node scripts/sync-content.mjs import $args
